[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stripcomment"
version = "1.0.0"
description = "🧹 A powerful CLI tool to intelligently strip comments from source code files while preserving strings and supporting 20+ programming languages"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "gitstq" }
]
keywords = [
    "comment",
    "strip",
    "remove",
    "code",
    "cleaner",
    "cli",
    "developer-tools",
    "code-processing"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Pre-processors",
    "Topic :: Text Processing :: Filters",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pathspec>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.scripts]
stripcomment = "stripcomment.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/stripcomment"
Documentation = "https://github.com/gitstq/stripcomment#readme"
Repository = "https://github.com/gitstq/stripcomment"
Issues = "https://github.com/gitstq/stripcomment/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/stripcomment"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
